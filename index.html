<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kelisim — ВЭД без юридических сюрпризов</title>
    <meta name="description" content="Kelisim — платформа управления рисками международных сделок для малого и среднего бизнеса Казахстана: проверка поставщика и его владельцев (OFAC, EU, UK, ООН, PEP), экспортный контроль, чек-лист импорта, оценка готовности сделки, двуязычные документы и контроль сроков." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kelisim" />
    <script>
      // apply the saved theme before the app renders (no flash)
      try {
        var p = localStorage.getItem("kls_theme") || "system";
        var d = p === "dark" || (p === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
