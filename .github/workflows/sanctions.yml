# Daily import of real sanctions lists (OFAC SDN, EU, UK) from OpenSanctions into production D1.
# Runs outside the Worker because parsing several MB of CSV exceeds Workers' free-plan CPU limit.
name: Sanctions lists

on:
  schedule:
    - cron: "30 1 * * *" # 06:30 Astana, before the 08:00 reminders
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sanctions:import
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
