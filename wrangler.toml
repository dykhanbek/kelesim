name = "kelisim"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Static frontend (Vite build output) served by Workers Static Assets.
# /api/* goes to the Worker first; everything else is the React SPA.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "kelisim-db"
database_id = "f275f916-9ed6-4833-9f6c-f3fce95577be" # replaced by `wrangler d1 create` (see README)
migrations_dir = "migrations"

# Optional: R2 bucket for proof files up to 10 MB. Without it, files up to 1 MB are kept in D1.
#   npx wrangler r2 bucket create kelisim-proofs   → then uncomment:
# [[r2_buckets]]
# binding = "PROOFS"
# bucket_name = "kelisim-proofs"

# Workers Logs: keeps console.log / errors searchable in the dashboard (Workers → kelisim → Logs)
[observability]
enabled = true

# Daily reminder job: 03:00 UTC = 08:00 Astana
[triggers]
crons = ["0 3 * * *"]

[vars]
APP_URL = "https://kelisim.erseit-aid.workers.dev"
TELEGRAM_BOT_USERNAME = "KelesimBot"
# Fictitious demo entries are screened in addition to the real OpenSanctions lists ("off" to disable)
DEMO_SANCTIONS = "on"
# Sender for emails, e.g. "Kelisim <noreply@your-domain.kz>" (domain verified in Resend)
EMAIL_FROM = ""
# Secrets (set with `wrangler secret put`): TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, RESEND_API_KEY
